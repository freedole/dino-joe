name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build (csc, .NET Framework 4.x)
        shell: cmd
        run: build.bat

      - name: Smoke test (--profile)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath build\DinoJoe.exe -ArgumentList '--profile' -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "DinoJoe.exe --profile exit $($p.ExitCode)" }

      - name: UI test (pokreni dinu na Windowsu, screenshot)
        shell: pwsh
        run: |
          $dir = Join-Path $env:APPDATA 'DinoJoe'
          New-Item -ItemType Directory -Force $dir | Out-Null
          "setup_done=1`r`nlang=sr-ijek`r`npersonality=balkanac`r`ncolor=1`r`npacks=odjordje-classic,dino-joe-basic-sr`r`n" | Out-File -Encoding utf8 (Join-Path $dir 'settings.ini')
          "stage=3`r`n" | Out-File -Encoding ascii (Join-Path $dir 'life.txt')
          $p = Start-Process -FilePath build\DinoJoe.exe -PassThru
          Start-Sleep -Seconds 12
          $alive = -not $p.HasExited
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            New-Item -ItemType Directory -Force dist | Out-Null
            $bmp.Save("dist\ui-test.png", [System.Drawing.Imaging.ImageFormat]::Png)
          } catch { Write-Host "screenshot nije uspio: $_" }
          if ($alive) { Stop-Process -Id $p.Id -Force }
          $logs = Join-Path $dir 'logs'
          if (Test-Path $logs) { Get-ChildItem $logs | ForEach-Object { Get-Content $_.FullName | Write-Host }; if ((Get-ChildItem $logs).Count -gt 0) { throw "Dino je zapisao gresku u log" } }
          if (-not $alive) { throw "DinoJoe.exe se ugasio u prvih 12 sekundi (exit $($p.ExitCode))" }
          Write-Host "UI test OK"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ui-test
          path: dist/ui-test.png
          if-no-files-found: ignore

      - name: Package zip
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          New-Item -ItemType Directory -Force dist\DinoJoe | Out-Null
          Copy-Item build\DinoJoe.exe dist\DinoJoe\
          Copy-Item LICENSE, README.md dist\DinoJoe\
          Copy-Item packs-builtin dist\DinoJoe\packs-builtin -Recurse
          Compress-Archive -Path dist\DinoJoe\* -DestinationPath "dist\DinoJoe-$ver.zip"
          (Get-FileHash "dist\DinoJoe-$ver.zip" -Algorithm SHA256).Hash | Out-File -Encoding ascii "dist\DinoJoe-$ver.zip.sha256"
          "VER=$ver" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Package MSIX (Microsoft Store)
        shell: pwsh
        run: |
          # verzija: v1.1.0 -> 1.1.0.0 (Store traži 0 na kraju); dev build -> verzija iz koda
          $num = if ($env:GITHUB_REF -like 'refs/tags/v*') { ($env:GITHUB_REF_NAME -replace '^v','') -replace '-.*$','' } else { '1.2.0' }
          $msixVer = "$num.0"
          $id = @{}
          Get-Content msix\identity.ini | Where-Object { $_ -match '^\s*([A-Z_]+)\s*=\s*(.*)$' } | ForEach-Object { $id[$Matches[1]] = $Matches[2].Trim() }
          $m = Get-Content msix\AppxManifest.xml -Raw
          $m = $m.Replace('{IDENTITY_NAME}', $id.IDENTITY_NAME).Replace('{PUBLISHER}', $id.PUBLISHER).Replace('{PUBLISHER_DISPLAY}', $id.PUBLISHER_DISPLAY).Replace('{VERSION}', $msixVer)
          $lay = 'dist\msix'
          New-Item -ItemType Directory -Force $lay | Out-Null
          Copy-Item build\DinoJoe.exe, LICENSE $lay
          Copy-Item packs-builtin "$lay\packs-builtin" -Recurse
          Copy-Item msix\Assets "$lay\Assets" -Recurse
          [IO.File]::WriteAllText("$PWD\$lay\AppxManifest.xml", $m, (New-Object Text.UTF8Encoding $false))
          $kit = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1
          $sign = Join-Path $kit.DirectoryName 'signtool.exe'
          & $kit.FullName pack /d $lay /p "dist\DinoJoe-$env:VER.msix" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx $LASTEXITCODE" }
          # testni potpis (samo za lokalno testiranje; Store prima nepotpisan .msix i sam ga potpisuje)
          $cert = New-SelfSignedCertificate -Type Custom -Subject $id.PUBLISHER -KeyUsage DigitalSignature -FriendlyName 'Dino Joe test' -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          New-Item -ItemType Directory -Force dist\test | Out-Null
          Copy-Item "dist\DinoJoe-$env:VER.msix" "dist\test\DinoJoe-$env:VER-test.msix" -Force
          & $sign sign /fd SHA256 /sha1 $cert.Thumbprint /s My "dist\test\DinoJoe-$env:VER-test.msix"
          if ($LASTEXITCODE -ne 0) { throw "signtool $LASTEXITCODE" }
          Export-Certificate -Cert $cert -FilePath dist\test\DinoJoe-test.cer | Out-Null

      - uses: actions/upload-artifact@v5
        with:
          name: DinoJoe-${{ env.VER }}
          path: |
            dist/*.zip
            dist/*.sha256

      - uses: actions/upload-artifact@v5
        with:
          name: DinoJoe-${{ env.VER }}-msix
          path: |
            dist/*.msix
            dist/test/*

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
            dist/*.msix
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
